spring.application.name=inventario
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always

# Banco de Dados
spring.datasource.url=jdbc:mysql://localhost:3306/inventario?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=root
spring.datasource.password=2112

# Front Config

spring.jpa.open-in-view=false
spring.data.web.pageable.max-page-size=100
app.cors.allowed-origins=http://localhost:5173

# Login

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax